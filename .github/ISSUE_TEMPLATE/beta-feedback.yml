name: "MaintainerShield beta feedback"
description: "Report a real-world false positive, false negative, or maintainer workflow problem"
title: "[Beta] "
labels:
  - beta
body:
  - type: input
    id: repository
    attributes:
      label: Repository
      description: "Repository where MaintainerShield was tested"
      placeholder: "owner/name"
    validations:
      required: true
  - type: dropdown
    id: event
    attributes:
      label: Event
      options:
        - pull_request
        - issues
  - type: textarea
    id: review_time
    attributes:
      label: Did PR signals save review time?
      description: "Share what changed in your review workflow."
    validations:
      required: false
  - type: textarea
    id: duplicate_feedback
    attributes:
      label: Which duplicate suggestions were useful or wrong?
      description: "Include issue numbers if available."
    validations:
      required: false
  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: "Include the rule/signal, output, and what you expected."
    validations:
      required: true
  - type: textarea
    id: misses
    attributes:
      label: What repository conventions did defaults miss?
    validations:
      required: false
  - type: textarea
    id: improvement
    attributes:
      label: What should MaintainerShield do instead?
    validations:
      required: false
