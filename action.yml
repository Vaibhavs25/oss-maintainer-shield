name: "MaintainerShield"
description: "Transparent maintainer-attention and duplicate-issue checks for GitHub"
author: "Vaibhavs25"
branding:
  icon: "shield"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token used to read repository metadata and post reports"
    required: true
  config:
    description: "Optional path to a MaintainerShield JSON configuration file"
    required: false
    default: ".maintainershield.json"
  output-json:
    description: "Path for machine-readable JSON output. Set empty to disable file output."
    required: false
    default: "maintainer-shield.json"
  comment:
    description: "Post the report as a GitHub comment"
    required: false
    default: "true"
  duplicate-issues:
    description: "Run duplicate-issue detection for issue events"
    required: false
    default: "true"
  fail-on-high:
    description: "Set to true to fail the action when PR risk is HIGH"
    required: false
    default: "false"

outputs:
  risk:
    description: "Computed pull-request risk level"
  score:
    description: "Computed pull-request risk score"
  changed-lines:
    description: "Total changed lines"
  duplicate-count:
    description: "Number of suggested duplicate issues"

runs:
  using: "node24"
  main: "src/index.js"
